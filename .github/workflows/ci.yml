name: guardlog CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  security-scan:
    name: Security scan on access.log (CI mode)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install guardlog globally
        run: npm install -g .

      # Place your log file at the repo root or adjust the path below.
      # Exit code 1 means HIGH risk was detected → CI fails automatically.
      - name: Scan access.log
        run: |
          if [ -f access.log ]; then
            guardlog scan access.log --ci --output guardlog-report.json
          else
            echo "No access.log found — skipping scan."
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardlog-report
          path: guardlog-report.json
          if-no-files-found: ignore
